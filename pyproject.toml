[project]
name = "ops-report-automator"
version = "1.0.0"
description = "Convert production CSV/XLSX data into polished Excel and HTML management reports."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4.0", "openpyxl>=3.1,<4.0"]

[project.scripts]
ops-report = "ops_reporter.cli:main"

[tool.ruff]
line-length = 110
